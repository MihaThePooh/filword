<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf7">
<title>Филворд</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header>
    <button class="burger" id="burger" type="button" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div>
      <div class="count" id="count">Загрузка…</div>
      <div class="solved" id="solved"></div>
    </div>
    <div class="coins" id="coins" title="Монеты">
      <span class="coin"></span><span id="coin-count">0</span>
    </div>
    <button class="action" id="action" type="button">Подсказка</button>
  </header>
  <main>
    <div class="slot" id="slot"></div>
    <div class="grid" id="grid"></div>
    <div class="words" id="words"></div>
  </main>
  <div class="menu" id="menu" hidden>
    <div class="menu-sheet">
      <button class="install" id="install" type="button">Установить игру<small>Иконка «Филворд» на экране телефона</small></button>
      <button id="hub" type="button">Все приложения (хаб)</button>
      <a href="https://ru.wiktionary.org/" target="_blank" rel="noopener">Толкования: Викисловарь</a>
      <button id="logout" type="button">Выйти</button>
      <div class="menu-version" id="version"></div>
    </div>
  </div>
  <script type="module" src="src/game.js"></script>
</body>
</html>
